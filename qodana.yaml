version: "1.0"

image: jetbrains/qodana-jvm:2025.3

profile:
  name: qodana.recommended

bootstrap: chmod +x mvnw && ./mvnw install -DskipTests

failThreshold: 0

include:
  - name: SpringJavaInjectionPointsAutowiringInspection
  - name: SpringBeanAutowiringInspection
  - name: JpaAttributeTypeInspection
  - name: JpaQueryApiInspection
  - name: SpringBootApplicationProperties
  - name: SqlResolveInspection
  - name: SpringTransactionalComponentInspection
  - name: SpringEventListenerInspection
  - name: SpringCacheableComponentInspection
  - name: ConstantConditions
  - name: UnnecessaryLocalVariable

exclude:
  - name: SpellCheckingInspection
  - name: TodoComment
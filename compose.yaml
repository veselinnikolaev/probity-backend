volumes:
  pgdata:

services:
  postgres:
    image: 'postgres:16'
    restart: unless-stopped
    environment:
      - 'POSTGRES_DB=${DB_NAME:-probity}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD:-password}'
      - 'POSTGRES_USER=${DB_USERNAME:-postgres}'
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-probity}"]
      interval: 10s
      timeout: 5s
      retries: 5
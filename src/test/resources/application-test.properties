# --- DOCKER COMPOSE ---
spring.docker.compose.enabled=false

# --- HIKARI (lighter pool for tests) ---
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# --- LOGGING (reduce noise) ---
logging.level.org.springframework.data.redis=WARN
logging.level.io.lettuce.core=WARN
logging.level.io.lettuce.core.protocol=WARN
logging.level.org.springframework.context.annotation=DEBUG

# --- JWT CONFIGURATION ---
probity.jwt.secret=J7d3kK29a91Lx8m4P2sQ6tUvWxYzA1B3C5D7E9F0G2H4I6J8K
probity.jwt.access.expiration.seconds=900
probity.jwt.refresh.expiration.seconds=604800
probity.jwt.issuer=probity
probity.jwt.refresh-prefix=probity:refresh:
probity.jwt.blacklist-prefix=probity:blacklist:
probity.jwt.session-prefix=session:

# --- CORS CONFIGURATION ---
probity.cors.allowed-origins=http://localhost:5173

# --- COOKIE CONFIGURATION ---
probity.cookie.samesite=Strict

# --- EMAIL VERIFICATION CONFIGURATION ---
probity.verify.email.prefix=verify:email:
probity.verify.email.expiration.seconds=86400
probity.verify.user.prefix=verify:user:
probity.verify.user.max-retries=3
probity.app.base-url=http://localhost:8080

# --- ASSISTANT CONFIGURATION ---
spring.ai.anthropic.api-key=test-key
probity.assistant.memory.key-prefix=probity:chat_memory:

# --- EXTERNAL SERVICES ---
sendgrid.api-key=test-key
sendgrid.from-email=test@probity.com

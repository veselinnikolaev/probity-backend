# yaml-language-server: $schema=https://grafana.com/docs/grafana/latest/setup-provisioning/dashboards/
apiVersion: 1

providers:
  - name: 'default'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
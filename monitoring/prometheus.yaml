global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'probity'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']  # use app:8080 if app is in compose
    # If running with prod profile, replace with:
    # static_configs:
    #   - targets: ['app:8080']
# --- SERVER CONFIGURATION ---
server.port=${PORT:8080}
probity.cookie.samesite=${SAME_SITE:Strict}
probity.app.base-url=${APP_BASE_URL:http://localhost:${PORT}}

# --- DATABASE CONFIGURATION ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:probity}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- CONNECTION POOL (HikariCP) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- FLYWAY CONFIGURATION ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# --- JWT CONFIGURATION ---
probity.jwt.secret=${JWT_SECRET}
probity.jwt.access.expiration.seconds=900
probity.jwt.refresh.expiration.seconds=604800
probity.jwt.issuer=probity
probity.jwt.blacklist-prefix=probity:blacklist:
probity.jwt.refresh-prefix=probity:refresh:
probity.jwt.session-prefix=session:

# --- CACHE CONFIGURATION ---
spring.cache.type=redis
spring.cache.redis.time-to-live=600s
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=probity:cache:
spring.cache.redis.use-key-prefix=true

# --- REDIS CONFIGURATION ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=default
spring.data.redis.password=${REDIS_PASSWORD:password}
spring.data.redis.database=${REDIS_DATABASE:1}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=1
spring.data.redis.lettuce.pool.max-wait=1000ms

# --- MONITORING CONFIGURATION ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- ASSISTANT CONFIGURATION ---
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.model=claude-sonnet-4-6
spring.ai.anthropic.chat.options.temperature=0.2
spring.ai.anthropic.chat.options.max-tokens=1024
probity.assistant.chat-memory.max-messages=${ASSISTANT_CHAT_MEMORY_MAX_MESSAGES:20}
probity.assistant.memory.key-prefix=probity:chat_memory:

# --- LOGGING CONFIGURATION ---
logging.level.org.springframework.data.redis=DEBUG
logging.level.io.lettuce.core=DEBUG
logging.level.io.lettuce.core.protocol=DEBUG

# --- DOCKER COMPOSE CONFIGURATION ---
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}

# --- TRADING CONFIGURATION ---
probity.trading.trading-days-per-year=252.0
probity.trading.history-lookback-days=90
probity.trading.z-score-95=1.645
probity.trading.volatility-threshold=15
probity.trading.volatility-addon-factor=10
probity.trading.risk-score-increment=5
probity.trading.default-annual-volatility=0.15
probity.trading.risk-free-rate=0.045

# --- MAIL CONFIGURATION ---
sendgrid.api-key=${SENDGRID_API_KEY}
sendgrid.from-email=${FROM_EMAIL:server@probity.com}
probity.verify.email.prefix=verify:email:
probity.verify.user.prefix=verify:user:
probity.verify.user.max-retries=3
probity.verify.email.expiration.seconds=86400

# --- YAHOO FINANCE CONFIGURATION ---
probity.marketdata.latest-price-lookback-days=14

# --- CORS CONFIGURATION ---
probity.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}